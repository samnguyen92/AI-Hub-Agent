events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 512M;

    # Internal Docker DNS resolver
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        '' $scheme;
    }

    server {
        listen 80 default_server;
        server_name _;

        # Router health check
        location = /health {
            access_log off;
            return 200 "healthy\n";
        }

        location / {
            # Extract slug: support demo-slug.alignvn.cloud, wp-slug.alignvn.cloud, or slug.demo.alignvn.cloud
            set $subdomain "";
            if ($host ~* ^(?:demo|wp)-([a-zA-Z0-9_\-]+)\.) {
                set $subdomain $1;
            }
            if ($subdomain = "") {
                if ($host ~* ^([a-zA-Z0-9_\-]+)\.) {
                    set $subdomain $1;
                }
            }

            # Avoid routing system reserved subdomains
            if ($subdomain ~* ^(www|hub|api|npm|n8n|files|convertb)$) {
                set $subdomain "";
            }

            if ($subdomain = "") {
                return 404 "AI Hub WordPress Router: Vui long truy cap theo dinh dang demo-[ten-site].alignvn.cloud\n";
            }

            set $upstream "http://hub_ai_wp_$subdomain:80";

            proxy_pass $upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
            proxy_connect_timeout 15s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Friendly response when WordPress container is not running or still launching
        error_page 502 = @site_down;
        location @site_down {
            default_type text/html;
            return 502 "<!DOCTYPE html><html><head><meta charset='utf-8'><title>Website đang khởi động</title><style>body{font-family:sans-serif;text-align:center;padding:50px;background:#0f172a;color:#f8fafc;}h1{color:#38bdf8;}p{color:#94a3b8;}code{background:#1e293b;padding:4px 8px;border-radius:4px;color:#38bdf8;}</style></head><body><h1>Website đang khởi tạo</h1><p>Website chưa sẵn sàng hoặc container đang khởi động. Vui lòng tải lại trang sau 10-15 giây!</p></body></html>";
        }
    }
}
