<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="icon" href="favicon.ico">
  <title>Align Builder</title>
  <link href="css/editor.css" rel="stylesheet">
  <link href="css/vvvebjs-editor-helpers.css" rel="stylesheet">
</head>
<body style="overflow:hidden">
  <div id="container" class="small-nav">
    <div class="main">
      <div id="vvveb-builder">
        <!-- Canvas Center -->
        <div id="iframe-wrapper">
          <div id="iframe-layer">
            <div class="loading-message active">
              <div class="animation-goo-blob"></div>
            </div>
            <div id="highlight-box">
              <div id="highlight-name"></div>
            </div>
            <div id="select-box">
              <div id="select-actions"></div>
            </div>
            <iframe src="about:blank" id="iframe1"></iframe>
          </div>
        </div>
      </div>
    </div>
  </div>
  <p class="text-center p-3 text-muted">
    Please launch Align Builder from WordPress Admin: <code>wp-admin/admin.php?page=align-builder</code>
  </p>
</body>
</html>
