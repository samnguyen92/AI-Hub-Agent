name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: hub_ai_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        working-directory: packages/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Database Migrations
        working-directory: packages/api
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/hub_ai_agent_test
          SYNC_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/hub_ai_agent_test
        run: |
          alembic upgrade head

      - name: Run Pytest Suite
        working-directory: packages/api
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/hub_ai_agent_test
          SYNC_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/hub_ai_agent_test
          AUTH_MODE: dev
          AUTH_SECRET_KEY: ci_secret_key_testing_12345678901234567890
          OPENROUTER_API_KEY: mock_openrouter_ci_key
          WORKSPACES_ROOT: /tmp/ci-workspaces
        run: |
          pytest -v

  frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: packages/web/package-lock.json

      - name: Install dependencies
        working-directory: packages/web
        run: npm ci || npm install

      - name: Build Next.js Application
        working-directory: packages/web
        env:
          NEXT_PUBLIC_API_URL: /api/backend
          NEXT_PUBLIC_AUTH_MODE: strict
        run: npm run build
