version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: hub_ai_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hub_ai_agent}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./packages/api
      dockerfile: Dockerfile
    container_name: hub_ai_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-hub_ai_agent}
    ports:
      - "8000:8000"
    volumes:
      - ./packages/api:/app
      - ./agents:/app/agents
      - ./skills:/app/skills
      - workspace_data:/workspaces
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ./packages/web
      dockerfile: Dockerfile
    container_name: hub_ai_web
    restart: always
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - INTERNAL_API_URL=http://api:8000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./packages/web:/app
      - /app/node_modules
      - /app/.next

  sandbox:
    build:
      context: ./packages/sandbox
      dockerfile: Dockerfile
    container_name: hub_ai_sandbox
    restart: always
    ports:
      - "8001:8001"
    volumes:
      - workspace_data:/workspaces
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  workspace_data:
