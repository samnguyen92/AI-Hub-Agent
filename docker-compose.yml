services:
  postgres:
    image: postgres:16-alpine
    container_name: hub_ai_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hub_ai_agent}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./packages/api
      dockerfile: Dockerfile
    container_name: hub_ai_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-hub_ai_agent}
    ports:
      - "8000:8000"
    volumes:
      - ./packages/api:/app
      - ./agents:/app/agents
      - ./skills:/app/skills
      - workspace_data:/workspaces
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: ./packages/api
      dockerfile: Dockerfile
    container_name: hub_ai_worker
    restart: always
    command: python -m app.worker
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-hub_ai_agent}
    volumes:
      - ./packages/api:/app
      - ./agents:/app/agents
      - ./skills:/app/skills
      - workspace_data:/workspaces
      - /var/run/docker.sock:/var/run/docker.sock

  web:
    build:
      context: ./packages/web
      dockerfile: Dockerfile
    container_name: hub_ai_web
    restart: always
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3100:3000"
    environment:
      - INTERNAL_API_URL=http://api:8000
      - NEXT_PUBLIC_API_URL=/api/backend
      - NEXT_PUBLIC_AUTH_MODE=${AUTH_MODE:-dev}
    command: sh -c "npm run build && npm run start"
    volumes:
      - ./packages/web:/app
      - /app/node_modules
      - /app/.next

  sandbox:
    build:
      context: ./packages/sandbox
      dockerfile: Dockerfile
    container_name: hub_ai_sandbox
    restart: always
    env_file:
      - .env
    volumes:
      - workspace_data:/workspaces
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  mariadb:
    image: mariadb:10.11
    container_name: hub_ai_mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-wp_secure_pass}
      MARIADB_DATABASE: wp_default
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 5

  router:
    image: nginx:alpine
    container_name: hub_ai_router
    restart: always
    ports:
      - "8500:80"
    volumes:
      - ./packages/router/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  workspace_data:
  mariadb_data:
